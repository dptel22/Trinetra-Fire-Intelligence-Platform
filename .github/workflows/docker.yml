name: Docker

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: docker build (backend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fresh-clone build check: the serving parquets are gitignored, so this
      # verifies the degraded-mode path — COPY of an (almost) empty
      # data/processed/ must succeed and the image must build.
      - name: Build image
        run: docker build -t trinetra-backend:ci .

      - name: Smoke-run container and hit /health
        run: |
          docker run -d --name trinetra-ci -p 8000:8000 trinetra-backend:ci
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          docker logs trinetra-ci
          exit 1
