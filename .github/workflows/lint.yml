name: Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: Ruff + mypy (app, pipeline, tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Run ruff
        run: uv run ruff check app/ pipeline/ tests/

      - name: Run mypy
        run: |
          uv run mypy app/ pipeline/ || echo "mypy findings are advisory; see logs"
