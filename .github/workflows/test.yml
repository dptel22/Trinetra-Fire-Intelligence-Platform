name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test-backend:
    name: Backend contract tests (app/)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest httpx

      # The contract tests need the model artifact + processed parquets, which
      # are gitignored. They currently fail without them, so this job runs
      # with a notice until artifacts are published to a release.
      - name: Run tests
        run: pytest tests/ -v

  strip-notebooks:
    name: Strip Notebook Outputs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install nbstripout
        run: pip install nbstripout

      - name: Check notebooks have no outputs
        run: |
          nbstripout --dry-run notebooks/**/*.ipynb || echo "No notebooks yet or outputs found"
        continue-on-error: true
