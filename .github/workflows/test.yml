name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test-backend:
    name: Backend contract tests (app/)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync

      # Contract tests verify real model loading when artifacts exist;
      # they skip gracefully with an informative notice if run without them.
      - name: Run tests
        run: uv run pytest tests/ -v -rs

  strip-notebooks:
    name: Strip Notebook Outputs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Check notebooks have no outputs
        run: |
          uv run nbstripout --dry-run notebooks/**/*.ipynb || echo "No notebooks yet or outputs found"
        continue-on-error: true
