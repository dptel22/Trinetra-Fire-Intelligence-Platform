version: '3.8'

# The working backend is the root `app/` FastAPI service (CatBoost/H3-day/DuckDB),
# built from the root Dockerfile. Legacy Postgres/Redis/backend_legacy/ml-worker/
# frontend scaffold services were removed in the 2026-09-02 cleanup — they pointed
# at Dockerfiles and infra that no longer exist. Use `docker build -t sih2026-backend .`
# or `docker compose up backend`.

services:
  # Backend API (FastAPI) — build from repo root
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sih2026-backend
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
      - DUCKDB_PATH=/data_writable/feature_store.duckdb
      # Audit trail must live on the writable volume — the baked-in /data is
      # read-only, so the default repo-relative path would fail in-container.
      - AUDIT_DB_PATH=/data_writable/audit.duckdb
      # Serving parquets are seeded onto the writable volume by the image
      # bootstrap (cp -n from the baked-in /data) so live ingestion can
      # actually update them inside the container.
      - H3_DAILY_PARQUET=/data_writable/sih2026_h3_daily_features_firms.parquet
      - OSMWRI_PARQUET=/data_writable/sih2026_h3_daily_features_with_osm_wri.parquet
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      # DECISION (2026-09-08, BACK-2): the base parquets are baked into the
      # image at /data (read-only) so the container boots with valid serving
      # data even with no volume mounted. The :ro host mount is the dev-mode
      # override letting the host's freshly-ingested parquets shadow the
      # baked-in ones. Live ingestion writes via DUCKDB_PATH/audit db to the
      # writable named volume below; moving the parquets themselves to a
      # read-write volume is deferred until multi-run persistence is needed.
      - ./data/processed:/data:ro
      # Raw OSM/WRI inputs stay outside the image and are read-only in the app.
      - ./data/raw:/app/data/raw:ro
      # Keep run history and raw-archive manifests across container restarts.
      - ./data/processed:/app/data/processed
      - sih2026-data:/data_writable
    # Bootstrap first: seed the writable volume's parquets from the read-only
    # /data mount if absent (the compose `command:` overrides the Dockerfile
    # CMD, so the image's own bootstrap would never run here).
    command: sh -c "mkdir -p /data_writable && for f in /data/*.parquet; do [ -f \"$$f\" ] && cp -n \"$$f\" /data_writable/ || true; done; exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - sih2026-network

volumes:
  sih2026-data:

networks:
  sih2026-network:
    driver: bridge
