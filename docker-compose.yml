version: '3.8'

# The working backend is the root `app/` FastAPI service (CatBoost/H3-day/DuckDB),
# built from the root Dockerfile. Legacy Postgres/Redis/backend_legacy/ml-worker/
# frontend scaffold services were removed in the 2026-09-02 cleanup — they pointed
# at Dockerfiles and infra that no longer exist. Use `docker build -t sih2026-backend .`
# or `docker compose up backend`.

services:
  # Backend API (FastAPI) — build from repo root
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sih2026-backend
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./data/processed:/data:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - sih2026-network

networks:
  sih2026-network:
    driver: bridge
