<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Outer Orbit Ring -->
  <path d="M 24,76 A 38,38 0 1,1 84,36" stroke="#FF6B35" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 20,62 A 38,38 0 0,0 48,88" stroke="#FF6B35" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Orbit Beacon Dot -->
  <circle cx="82" cy="30" r="4.5" fill="#FF6B35"/>

  <!-- Satellite Mark -->
  <g transform="translate(14, 20) rotate(-45)">
    <!-- Solar Panels -->
    <rect x="-10" y="-3.5" width="6" height="7" rx="1" fill="#E2E8F0" stroke="#1E293B" stroke-width="0.8"/>
    <rect x="4" y="-3.5" width="6" height="7" rx="1" fill="#E2E8F0" stroke="#1E293B" stroke-width="0.8"/>
    <!-- Body -->
    <rect x="-3" y="-4.5" width="6" height="9" rx="1.5" fill="#FF6B35"/>
    <!-- Signal waves -->
    <path d="M -1.5,7 A 3,3 0 0,0 1.5,7" stroke="#FF6B35" stroke-width="0.8" fill="none"/>
    <path d="M -3,9 A 5,5 0 0,0 3,9" stroke="#FF6B35" stroke-width="0.8" fill="none"/>
  </g>

  <!-- Globe Body -->
  <circle cx="50" cy="52" r="26" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>

  <!-- Thermal Hotspot Radar Rings on India -->
  <circle cx="50" cy="52" r="18" fill="#E67E22" opacity="0.35"/>
  <circle cx="50" cy="52" r="13" fill="#D74E26" opacity="0.6"/>
  <circle cx="50" cy="52" r="8" fill="#E74C3C" opacity="0.9"/>
  <!-- Core Hotspot Pulse -->
  <circle cx="50" cy="52" r="3.5" fill="#FFFFFF"/>
</svg>