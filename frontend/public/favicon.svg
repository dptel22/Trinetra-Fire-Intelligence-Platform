<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="heatGlow" cx="58%" cy="54%" r="48%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#FF5722" />
      <stop offset="60%" stop-color="#FF8A50" />
      <stop offset="90%" stop-color="#FFAB76" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FFAB76" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>
  </defs>

  <!-- Concentric Thermal Radar Flare Core -->
  <circle cx="58" cy="54" r="28" fill="url(#heatGlow)" />
  <circle cx="58" cy="54" r="14" fill="#FF4500" />
  <circle cx="58" cy="54" r="6" fill="#FFFFFF" />

  <!-- Outer Orbit Radar Sweep Rings -->
  <path d="M 32,50 A 34,34 0 0,0 54,88" stroke="url(#orbitGrad)" stroke-width="5" stroke-linecap="round" />
  <path d="M 64,24 A 34,34 0 0,1 88,58" stroke="url(#orbitGrad)" stroke-width="5" stroke-linecap="round" />
  <path d="M 66,78 A 34,34 0 0,1 78,70" stroke="url(#orbitGrad)" stroke-width="5" stroke-linecap="round" />

  <!-- Satellite Station -->
  <g transform="translate(18, 16) rotate(-45)">
    <!-- Solar Panels -->
    <rect x="-11" y="-4" width="7" height="8" rx="1" fill="#263238" stroke="#FFFFFF" stroke-width="1.2" />
    <rect x="4" y="-4" width="7" height="8" rx="1" fill="#263238" stroke="#FFFFFF" stroke-width="1.2" />
    <!-- Center Chassis -->
    <rect x="-4" y="-5" width="8" height="10" rx="1.5" fill="#1E293B" stroke="#FFFFFF" stroke-width="1.2" />
    <!-- Signal Antenna & Radar Beams -->
    <path d="M -1.5,8 A 3.5,3.5 0 0,0 1.5,8" stroke="#FFFFFF" stroke-width="1.2" fill="none" />
    <path d="M -3.5,11 A 6.5,6.5 0 0,0 3.5,11" stroke="#FFFFFF" stroke-width="1.2" fill="none" />
  </g>
</svg>